name: Release
# Bump VERSION on main (e.g. 1.0.0 -> 1.1.0) to publish an update for the Pi.
# Creates tag v<VERSION> + release with target-cam-<VERSION>.tar.gz and .sha256; skipped if it already exists.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: v
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.exists != '1'
        run: python -m unittest discover -s tests
      - if: steps.v.outputs.exists != '1'
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bash tools/build-release.sh
      - if: steps.v.outputs.exists != '1'
        run: gh release create "${{ steps.v.outputs.tag }}" dist/* --target "$GITHUB_SHA" --title "${{ steps.v.outputs.tag }}" --generate-notes
