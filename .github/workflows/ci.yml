name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # Raspberry Pi OS Bookworm
      - run: pip install flask pillow
      - run: python -m py_compile app.py updater.py launcher.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh harden.sh cleanup.sh tools/build-release.sh
      - name: Release package holds what install.sh needs
        run: |
          bash tools/build-release.sh
          tar tzf dist/target-cam.tar.gz | sort > /tmp/pkg
          for f in app.py updater.py launcher.py VERSION cleanup.sh install.sh harden.sh systemd/target.service static/icon-192.png; do
            grep -qx "$f" /tmp/pkg || { echo "missing $f"; exit 1; }
          done
          test -f dist/install.sh
      - name: App answers via the launcher
        run: |
          mkdir -p /tmp/t && export APP_ROOT=/tmp/t/app TARGET_DIR=/tmp/t/target UPDATE_CHECK=0 MODEM_URL=http://127.0.0.1:1
          python launcher.py & sleep 5
          curl -fsS http://127.0.0.1:8080/version
          curl -fsS http://127.0.0.1:8080/ | grep -q "Target Cam"
